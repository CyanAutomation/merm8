name: Kaseki DRY Sweep

on:
  schedule:
    - cron: "0 6 * * 5"
  workflow_dispatch:

run-name: DRY sweep · ${{ github.repository }}@${{ github.sha }}

permissions:
  contents: read

# Protect the complete external Kaseki run from overlapping sweeps.
concurrency:
  group: kaseki-dry-sweep-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dry_sweep:
    name: Run Kaseki DRY sweep
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Kaseki allows a run to last three hours; leave time for
    # preflight and final status polling.
    timeout-minutes: 200

    # Configure KASEKI_API_TOKEN as a secret, KASEKI_BASE_URL as an
    # environment variable, and KASEKI_ALLOWED_HOSTS as comma-separated
    # approved controller hostnames in the kaseki-agent environment.
    # Restrict that environment to main and leave required reviewers empty.
    environment: kaseki-agent

    env:
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}
      KASEKI_ALLOWED_HOSTS: ${{ vars.KASEKI_ALLOWED_HOSTS }}

      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      REF: main

      TASK_DESCRIPTION: >-
        Perform a conservative DRY-principle review of this repository.

      # Adjust these paths for each repository.
      ALLOWLIST: >-
        cmd/**/*,internal/**/*,parser-node/**/*,scripts/**/*,src/**/*,test/**/*,tests/**/*,worker/**/*,worker-tests/**/*

      VALIDATION_COMMAND: >-
        npm ci && npm --prefix parser-node ci && npm test &&
        PARSER_SCRIPT=./parser-node/parse.ts go vet ./... &&
        PARSER_SCRIPT=./parser-node/parse.ts go test ./... -count=1 &&
        PARSER_SCRIPT=./parser-node/parse.ts go test -tags=integration ./cmd/server -count=1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate Kaseki configuration
        run: node --experimental-strip-types scripts/validate-kaseki-url.ts

      - name: Verify controller health
        # Keep the immutable SHA pin; ignore the pedantic tag check until this commit is tagged.
        uses: CyanAutomation/kaseki-agent/.github/actions/verify-controller-health@30db5d15e117b8d8de13eb66766d48cf6b7d618b # zizmor: ignore[stale-action-refs]
        with:
          base-url: ${{ vars.KASEKI_BASE_URL }}

      - name: Verify controller readiness
        shell: bash
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --proto '=https' --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            --output "$response_file" \
            "$KASEKI_BASE_URL/ready"

          jq -e '.status == "ready"' "$response_file" >/dev/null

          echo "Kaseki readiness check succeeded."

      - name: Verify gateway connectivity and authentication
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${KASEKI_API_TOKEN:?Configure KASEKI_API_TOKEN as an environment secret}"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --proto '=https' --fail-with-body --silent --show-error \
            --retry 3 \
            --connect-timeout 10 --max-time 60 \
            --output "$response_file" \
            --header "Authorization: Bearer $KASEKI_API_TOKEN" \
            "$KASEKI_BASE_URL/api/v1/gateway-test?stage=1"

          jq -e '.status == "ok"' "$response_file" >/dev/null

          echo "Kaseki gateway authentication succeeded."

      - name: Submit DRY sweep
        id: submit
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${KASEKI_API_TOKEN:?Configure KASEKI_API_TOKEN as an environment secret}"

          idempotency_key="$(
            tr '[:upper:]' '[:lower:]' < /proc/sys/kernel/random/uuid
          )"

          payload="$(
            jq -n \
              --arg repoUrl "$REPO_URL" \
              --arg ref "$REF" \
              --arg taskDescription "$TASK_DESCRIPTION" \
              --arg validationCommand "$VALIDATION_COMMAND" \
              --arg allowlist "$ALLOWLIST" \
              --arg idempotencyKey "$idempotency_key" \
              '{
                repoUrl: $repoUrl,
                ref: $ref,
                taskMode: "patch",
                publishMode: "pr",
                timeoutSeconds: 10800,
                maxDiffBytes: 102400,
                idempotencyKey: $idempotencyKey,

                changedFilesAllowlist: (
                  $allowlist
                  | split(",")
                  | map(gsub("^\\s+|\\s+$"; ""))
                  | map(select(length > 0))
                ),

                validationCommands: [$validationCommand],

                goalCheck: {
                  enabled: true,
                  maxRetries: 1
                },

                taskPrompt: (
                  $taskDescription

                  + "\n\nLook for duplicated knowledge rather than merely duplicated text. "
                  + "Strong candidates include repeated business rules, validation rules, "
                  + "constants, configuration knowledge, parsing or normalisation logic, "
                  + "transformations, and substantially identical implementations that "
                  + "must remain synchronised. "

                  + "\n\nDo not assume that all repetition violates DRY. Similar-looking "
                  + "code may represent separate concepts or may need to evolve independently. "
                  + "Prefer clear duplication over an abstraction that increases coupling, "
                  + "indirection, or cognitive load. "

                  + "\n\nIdentify the single strongest DRY improvement available. Only act "
                  + "when the duplication represents the same underlying knowledge and "
                  + "consolidation has a clear maintenance benefit. "

                  + "\n\nPrefer reusing an existing abstraction. If a new abstraction is "
                  + "justified, keep it at the narrowest sensible scope. "

                  + "\n\nMake at most one focused refactoring. "

                  + "\n\nA no-change result is successful. If there is no sufficiently "
                  + "valuable, high-confidence DRY improvement, make no changes."
                )
              }'
          )"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(
            curl --silent --show-error \
              --retry 3 --retry-all-errors \
              --max-time 60 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST "$KASEKI_BASE_URL/api/v1/runs" \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload"
          )"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "::error title=Kaseki submission failed::Kaseki returned HTTP $http_status"
            exit 1
          fi

          run_id="$(jq -er '.id' "$response_file")"
          run_id="$(KASEKI_RUN_ID="$run_id" node --experimental-strip-types scripts/validate-kaseki-run-id.ts)"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          echo "idempotency_key=$idempotency_key" >> "$GITHUB_OUTPUT"

          echo "Kaseki DRY sweep submitted."

      - name: Wait for Kaseki completion
        id: wait
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id }}
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${RUN_ID:?Kaseki run ID is missing}"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          deadline=$((SECONDS + 11100))

          # Kaseki can run for up to three hours. Poll a little longer so a
          # terminal result created near that limit is still observed.
          while (( SECONDS < deadline )); do
            if ! curl --proto '=https' --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 60 \
              --output "$response_file" \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              "$KASEKI_BASE_URL/api/v1/runs/$RUN_ID/status"; then
              echo "::warning title=Kaseki status unavailable::The status request failed after retries; polling will continue."
              sleep 60
              continue
            fi

            if ! status="$(jq -er '.status | strings' "$response_file")"; then
              echo "status=invalid response" >> "$GITHUB_OUTPUT"
              echo "::error title=Invalid Kaseki status response::The controller response did not include a valid status."
              exit 1
            fi

            case "$status" in
              completed)
                exit_code="$(jq -er '.exitCode // 0 | numbers' "$response_file")"
                if [[ "$exit_code" != 0 ]]; then
                  echo "status=failed (exit code $exit_code)" >> "$GITHUB_OUTPUT"
                  echo "::error title=Kaseki DRY sweep failed::The controller completed with exit code $exit_code."
                  exit 1
                fi
                echo "status=completed" >> "$GITHUB_OUTPUT"
                echo "Kaseki status: completed"
                exit 0
                ;;

              failed|cancelled)
                echo "status=$status" >> "$GITHUB_OUTPUT"
                echo "::error title=Kaseki DRY sweep failed::The controller reported status $status."
                exit 1
                ;;

              queued|running)
                echo "Kaseki status: $status"
                ;;

              *)
                echo "status=unexpected" >> "$GITHUB_OUTPUT"
                echo "::error title=Unexpected Kaseki status::Controller returned an unsupported status"
                exit 1
                ;;
            esac

            sleep 60
          done

          echo "status=timed out" >> "$GITHUB_OUTPUT"
          echo "::error title=Kaseki run timed out::No terminal status after 185 minutes"
          exit 1

      - name: Publish run details
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id || 'not submitted' }}
          FINAL_STATUS: ${{ steps.wait.outputs.status || 'not completed' }}
        run: |
          {
            echo "## Kaseki DRY sweep"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Repository | \`$REPO_URL\` |"
            echo "| Ref | \`$REF\` |"
            echo "| Allowed paths | \`$ALLOWLIST\` |"
            echo "| Validation | \`$VALIDATION_COMMAND\` |"
            echo "| Maximum refactorings | \`1\` |"
            echo "| Kaseki run | \`$RUN_ID\` |"
            echo "| Final status | \`$FINAL_STATUS\` |"
          } >> "$GITHUB_STEP_SUMMARY"
