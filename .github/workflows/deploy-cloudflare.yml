name: Deploy Cloudflare Worker

on:
  workflow_call:
    inputs:
      build_sha:
        description: Commit SHA verified by CI and approved for deployment
        required: true
        type: string
    secrets:
      cloudflare_api_token:
        required: true
      cloudflare_account_id:
        required: true
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm deployment of the selected ref to production
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  # A called workflow inherits its caller's github.event_name, so build_sha
  # identifies a reusable-workflow invocation regardless of the caller event.
  verify-deploy-commit:
    if: >-
      inputs.build_sha != '' ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_production)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      BUILD_SHA: ${{ inputs.build_sha || github.sha }}
      IS_REUSABLE_CALL: ${{ inputs.build_sha != '' }}
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit and manual CI status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$BUILD_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "Deployment input must be a full commit SHA." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          git fetch origin main
          if ! git merge-base --is-ancestor "$BUILD_SHA" origin/main; then
            echo "Deployment commit is not reachable from main." >&2
            exit 1
          fi

          if [[ "$IS_REUSABLE_CALL" != "true" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual production deployments must be dispatched from main." >&2
              exit 1
            fi

            runs="$(gh run list --workflow ci.yml --commit "$BUILD_SHA" \
              --json headSha,headBranch,event,status,conclusion --limit 100)"
            if ! jq -e --arg sha "$BUILD_SHA" \
              'any(.[]; .headSha == $sha and .headBranch == "main" and .event == "push" and .status == "completed" and .conclusion == "success")' \
              <<< "$runs" >/dev/null; then
              echo "No successful CI push run was found for $BUILD_SHA; refusing to deploy." >&2
              exit 1
            fi
          fi

  deploy:
    if: >-
      inputs.build_sha != '' ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_production)
    needs: verify-deploy-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://merm8.scheimann.workers.dev
    env:
      BUILD_SHA: ${{ inputs.build_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.build_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx wrangler deploy --var "BUILD_VERSION:$BUILD_SHA" --var "BUILD_SHA:$BUILD_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare_api_token || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare_account_id || secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test deployed Worker
        env:
          MERM8_API_URL: https://merm8.scheimann.workers.dev
          MERM8_EXPECTED_BUILD_SHA: ${{ inputs.build_sha || github.sha }}
        run: |
          for attempt in 1 2 3 4 5; do
            if node scripts/smoke-worker.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1
