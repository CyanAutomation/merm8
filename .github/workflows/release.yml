name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag (for example, v1.0.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      VERSION_INPUT: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$VERSION_INPUT"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi

          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Release tag does not exist: $version" >&2
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "$version")"
          git fetch origin main
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag $version does not reference a commit reachable from main" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          notes_file="$(mktemp)"
          git for-each-ref "refs/tags/$version" --format='%(contents)' > "$notes_file"
          if [[ ! -s "$notes_file" ]]; then
            printf 'Release %s\n' "$version" > "$notes_file"
          fi

          prerelease_args=()
          if [[ "$version" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$version" --verify-tag --title "$version" \
            --notes-file "$notes_file" "${prerelease_args[@]}"
