name: Kaseki Docs Sweep

on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:

run-name: >-
  Docs sweep · ${{ github.repository }}@${{ github.event.repository.default_branch }}

permissions:
  contents: read

concurrency:
  group: kaseki-docs-sweep-${{ github.repository }}
  cancel-in-progress: false

jobs:
  system_status:
    name: Kaseki System Status
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: kaseki-agent
    env:
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Kaseki URL
        run: node scripts/validate-kaseki-url.mjs
      - name: Verify controller health
        shell: bash
        run: |
          set -euo pipefail
          : "${KASEKI_BASE_URL:?KASEKI_BASE_URL is not configured}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --proto '=https' --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            --output "$response_file" \
            "$KASEKI_BASE_URL/health"
          jq -e '.status == "healthy"' "$response_file" >/dev/null
          jq . "$response_file"

  readiness:
    name: Kaseki System Readiness
    needs: system_status
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: kaseki-agent
    env:
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Kaseki URL
        run: node scripts/validate-kaseki-url.mjs
      - name: Verify controller readiness
        shell: bash
        run: |
          set -euo pipefail
          : "${KASEKI_BASE_URL:?KASEKI_BASE_URL is not configured}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --proto '=https' --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            --output "$response_file" \
            "$KASEKI_BASE_URL/ready"
          jq -e '.status == "ready"' "$response_file" >/dev/null
          jq . "$response_file"

  api_connection:
    name: Kaseki API Status
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: kaseki-agent
    env:
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Kaseki URL
        run: node scripts/validate-kaseki-url.mjs
      - name: Verify gateway connectivity and authentication
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${KASEKI_BASE_URL:?KASEKI_BASE_URL is not configured}"
          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --proto '=https' --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            --output "$response_file" \
            --header "Authorization: Bearer $KASEKI_API_TOKEN" \
            "$KASEKI_BASE_URL/api/gateway-test?stage=1"
          jq -e '.status == "ok"' "$response_file" >/dev/null
          jq . "$response_file"

  dispatch:
    name: Submit Kaseki documentation sweep
    needs: api_connection
    runs-on: ubuntu-latest
    # Kaseki accepts a three-hour task budget; leave time to observe its terminal result.
    timeout-minutes: 190
    environment: kaseki-agent
    env:
      # Configure this only as a secret in the protected kaseki-docs environment.
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}

      # Automatically targets the repository containing this workflow.
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      # Keep scheduled and manually dispatched sweeps within the same fixed scope.
      REF: ${{ github.event.repository.default_branch }}
      TASK_DESCRIPTION: Keep README.md and docs/ accurate against the current implementation.
      ALLOWLIST: README.md,docs/**/*.md
      VALIDATION_COMMAND: npm test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Kaseki URL
        run: node scripts/validate-kaseki-url.mjs
      - name: Check Kaseki availability
        run: |
          set -euo pipefail
          : "${KASEKI_BASE_URL:?KASEKI_BASE_URL is not configured}"
          curl --proto '=https' --fail --silent --show-error --max-time 20 \
            "$KASEKI_BASE_URL/ready"

      - name: Submit documentation sweep
        id: submit
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${KASEKI_BASE_URL:?KASEKI_BASE_URL is not configured}"
          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"
          idempotency_key="$(uuidgen | tr '[:upper:]' '[:lower:]')"

          payload="$(
            jq -n \
              --arg repoUrl "$REPO_URL" \
              --arg ref "$REF" \
              --arg taskDescription "$TASK_DESCRIPTION" \
              --arg validationCommand "$VALIDATION_COMMAND" \
              --arg allowlist "$ALLOWLIST" \
              --arg idempotencyKey "$idempotency_key" \
              '{
                repoUrl: $repoUrl,
                ref: $ref,
                idempotencyKey: $idempotencyKey,
                taskMode: "patch",
                publishMode: "pr",
                scouting: { enabled: false },
                goalSetting: { enabled: false },
                timeoutSeconds: 10800,
                changedFilesAllowlist: (
                  $allowlist
                  | split(",")
                  | map(gsub("^\\s+|\\s+$"; ""))
                  | map(select(length > 0))
                ),
                validationCommands: (
                  if $validationCommand == "" then []
                  else [$validationCommand]
                  end
                ),
                goalCheck: {
                  enabled: true,
                  maxRetries: 1
                },
                taskPrompt: (
                  $taskDescription
                  + "\n\nPerform the documentation sweep for this repository. "
                  + "First read repository instructions, then inspect the current "
                  + "implementation and compare it against README.md and documentation "
                  + "under docs/. Update documentation only where inaccurate, incomplete, "
                  + "or stale. Do not modify application code, tests, configuration, "
                  + "dependencies, lockfiles, CI workflows, or generated files. "
                  + "Do not invent behavior. Avoid cosmetic rewrites. Before finishing, "
                  + "review the diff to confirm it contains documentation-only changes. "
                  + "If documentation is already accurate, make no changes and do not "
                  + "open a pull request."
                )
              }'
          )"
          
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(
            curl --silent --show-error \
              --retry 3 --retry-all-errors --max-time 60 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST "$KASEKI_BASE_URL/api/runs" \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload"
          )"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "::error title=Kaseki submission failed::Kaseki returned HTTP $http_status"

            {
              echo "## Kaseki submission failed"
              echo
              echo "Kaseki returned HTTP \`$http_status\`."
              echo
              echo "The controller response was withheld from logs and the job summary."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          run_id="$(jq -er '.id' "$response_file")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Kaseki completion
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
          KASEKI_RUN_ID: ${{ steps.submit.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KASEKI_BASE_URL:?KASEKI_BASE_URL is not configured}"
          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"
          : "${KASEKI_RUN_ID:?Kaseki did not return a run ID}"

          run_id_uri="$(jq -rn --arg runId "$KASEKI_RUN_ID" '$runId | @uri')"
          response_file=""
          trap 'rm -f "${response_file:-}"' EXIT
          deadline=$((SECONDS + 11340))
          while (( SECONDS < deadline )); do
            response_file="$(mktemp)"
            http_status="$(
              curl --proto '=https' --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                --output "$response_file" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer $KASEKI_API_TOKEN" \
                "$KASEKI_BASE_URL/api/runs/$run_id_uri/status" || true
            )"

            if [[ "$http_status" =~ ^2 ]]; then
              status="$(jq -er '.status' "$response_file")"
              case "$status" in
                completed)
                  echo "Kaseki documentation sweep completed successfully."
                  exit 0
                  ;;
                failed)
                  echo "::error title=Kaseki documentation sweep failed::The controller reported a failed run."
                  exit 1
                  ;;
                queued|running)
                  ;;
                *)
                  echo "::error title=Unexpected Kaseki status::The controller returned an unsupported run state."
                  exit 1
                  ;;
              esac
            else
              echo "::warning title=Kaseki status unavailable::Will retry status polling."
            fi

            rm -f "$response_file"
            response_file=""
            sleep 60
          done

          echo "::error title=Kaseki documentation sweep timed out::The controller did not report a terminal result within 189 minutes."
          exit 1

      - name: Publish submission details
        env:
          KASEKI_RUN_ID: ${{ steps.submit.outputs.run_id }}
        run: |
          {
            echo "## Kaseki submission"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Repository | \`$REPO_URL\` |"
            echo "| Ref | \`$REF\` |"
            echo "| Mode | \`patch\` |"
            echo "| Timeout | 3 hours |"
            echo "| Kaseki run | \`$KASEKI_RUN_ID\` |"
            echo
            echo "### Allowed paths"
            echo '```text'
            echo "$ALLOWLIST" | tr ',' '\n'
            echo '```'
            echo
            echo "### Validation"
            echo '```text'
            echo "${VALIDATION_COMMAND:-No validation command configured}"
            echo '```'
            echo
            echo "Monitor the run in the configured Kaseki controller UI."
          } >> "$GITHUB_STEP_SUMMARY"
