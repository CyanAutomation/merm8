name: integration-contract-tests

on:
  pull_request:
    paths:
      - "cmd/server/**"
      - "internal/**"
      - "parser-node/**"
      - "third_party/prometheus/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/integration-contract-tests.yml"
  push:
    branches: [main]
    paths:
      - "cmd/server/**"
      - "internal/**"
      - "parser-node/**"
      - "third_party/prometheus/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/integration-contract-tests.yml"

permissions:
  contents: read

concurrency:
  group: integration-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: parser-node/package-lock.json

      - name: Install parser dependencies
        run: npm --prefix parser-node ci

      - name: Contract integration suite (stable timing budget)
        env:
          PARSER_CONCURRENCY_LIMIT: "1"
        run: |
          go test ./cmd/server -run '^TestServerContractIntegration_' -count=1 -timeout=90s
