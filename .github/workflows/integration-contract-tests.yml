name: integration-contract-tests

on:
  pull_request:
    paths:
      - "cmd/server/**"
      - "internal/**"
      - "parser-node/**"
      - ".github/workflows/integration-contract-tests.yml"
  push:
    branches: [main]
    paths:
      - "cmd/server/**"
      - "internal/**"
      - "parser-node/**"
      - ".github/workflows/integration-contract-tests.yml"

jobs:
  contract-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: parser-node/package-lock.json

      - name: Install parser dependencies
        run: npm --prefix parser-node ci

      - name: Contract integration suite (stable timing budget)
        env:
          PARSER_CONCURRENCY_LIMIT: "1"
        run: |
          go test ./cmd/server -run '^TestServerContractIntegration_' -count=1 -timeout=90s
