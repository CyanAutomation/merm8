name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            parser-node/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix parser-node ci

      - name: Type-check and test Worker
        run: npm test

      - name: Verify Go formatting
        run: |
          unformatted_files="$(git ls-files -z -- '*.go' ':!third_party/**' | xargs -0 -r gofmt -l)"
          test -z "$unformatted_files"

      - name: Verify Go modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run Go vet and test suite
        env:
          PARSER_SCRIPT: ./parser-node/parse.ts
        run: |
          go vet ./...
          go test ./... -count=1

  deploy-production:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      build_sha: ${{ github.sha }}
    secrets:
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
