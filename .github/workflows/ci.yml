name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            parser-node/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix parser-node ci

      - name: Type-check and test Worker
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/merm8-v8coverage
        run: |
          mkdir -p "$NODE_V8_COVERAGE"
          npm test

      - name: Audit changed TypeScript code
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_DIR: ${{ runner.temp }}/merm8-v8coverage
        run: ./node_modules/.bin/fallow audit --coverage "$COVERAGE_DIR"

      - name: Verify Go formatting
        run: |
          unformatted_files="$(git ls-files -z -- '*.go' ':!third_party/**' | xargs -0 -r gofmt -l)"
          test -z "$unformatted_files"

      - name: Verify Go modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run Go vet and test suite
        env:
          PARSER_SCRIPT: ./parser-node/parse.ts
        run: |
          go vet ./...
          go test ./... -count=1

  worker-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Worker bundle changes
        id: detect
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$BEFORE_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || \
            ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- \
            worker/ src/ package.json package-lock.json .npmrc wrangler.toml tsconfig.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-production:
    needs: [test, worker-changes]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.worker-changes.outputs.changed == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      build_sha: ${{ github.sha }}
    secrets:
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
